# Read the Docs build configuration.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# docs/conf.py imports loopuss (autodoc, preset tables), so the package itself is
# installed together with the docs extra. LTspice is not needed to build.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
